# =============================================================================
# RetailIQ — Render Infrastructure Blueprint (render.yaml)
# =============================================================================
# Docs: https://render.com/docs/blueprint-spec
# Deploy: Connect your GitHub repo to Render and choose "Blueprint".
# =============================================================================

databases:
  # ---------------------------------------------------------------------------
  # 1. Managed PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: retailiq-db
    databaseName: retailiq_db
    user: retailiq_user
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: retailiq-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn retailiq.backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: retailiq-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        # In Render, update this to your static site URL: https://retailiq-frontend.onrender.com
        sync: false

  # ---------------------------------------------------------------------------
  # 3. React Frontend Static Site (Vite + React)
  # ---------------------------------------------------------------------------
  - type: web
    name: retailiq-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: retailiq/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # Set to your backend URL e.g. https://retailiq-backend.onrender.com
        sync: false
